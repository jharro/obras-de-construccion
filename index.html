<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ArchHub | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="login-container" class="w-full max-w-sm bg-gray-900 p-8 rounded-xl shadow-xl border border-gray-800">
        <h1 class="text-2xl font-bold mb-6 text-center">ArchHub</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Usuario" class="w-full bg-gray-800 p-3 rounded border border-gray-700">
            <input type="password" id="password" placeholder="Contraseña" class="w-full bg-gray-800 p-3 rounded border border-gray-700">
            <button onclick="iniciarSesion()" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">Ingresar</button>
        </div>
        <p id="status" class="mt-4 text-center text-sm text-gray-400"></p>
    </div>

    <div id="dashboard-container" class="hidden w-full max-w-6xl p-4">
        <div id="content"></div>
    </div>

    <script>
        // REEMPLAZA ESTA URL CON LA TUYA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzy40HRNJCWkPGSRGqdZN6FXxd4MKInklZZvit0ZR94WZKBpryh-Ca_NDUE-e6nyBlzw/exec";

        async function iniciarSesion() {
            const btn = document.getElementById('login-btn');
            const status = document.getElementById('status');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            btn.disabled = true;
            status.innerText = "Conectando...";

            try {
                // Petición única de alta velocidad
                const response = await fetch(`${GAS_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    renderizarDashboard(data);
                } else {
                    throw new Error("Usuario o contraseña incorrectos");
                }
            } catch (err) {
                status.innerText = err.message;
                btn.disabled = false;
            }
        }

        function renderizarDashboard(data) {
            // Aquí va tu lógica original de renderizado que tenías en tu index.html
            const container = document.getElementById('content');
            container.innerHTML = `<h2 class="text-xl mb-4">Bienvenido, ${data.name || 'Usuario'}</h2>`;
            // ... resto de tu código de renderizado de tablas y proyectos ...
        }
    </script>
</body>
</html>
