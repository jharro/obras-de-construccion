<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ArchHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Login ArchHub</h2>
            <input type="text" id="user" placeholder="Usuario" class="w-full p-2 mb-4 bg-gray-700 rounded border border-gray-600">
            <input type="password" id="pass" placeholder="Contraseña" class="w-full p-2 mb-4 bg-gray-700 rounded border border-gray-600">
            <button onclick="login()" class="w-full bg-blue-600 py-2 rounded font-bold hover:bg-blue-500">Ingresar</button>
            <p id="msg" class="text-red-400 mt-4 text-sm text-center"></p>
        </div>
    </div>

    <div id="dashboard" class="hidden p-8">
        <h1 class="text-3xl font-bold mb-4">Bienvenido al sistema</h1>
        <div id="data-view" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzy40HRNJCWkPGSRGqdZN6FXxd4MKInklZZvit0ZR94WZKBpryh-Ca_NDUE-e6nyBlzw/exec";

        async function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const msg = document.getElementById('msg');
            
            msg.innerText = "Cargando...";
            
            try {
                const res = await fetch(`${GAS_URL}?action=login&user=${u}&pass=${p}`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    renderDashboard(data);
                } else {
                    msg.innerText = "Credenciales incorrectas o usuario inactivo.";
                }
            } catch (e) {
                msg.innerText = "Error de conexión: " + e.message;
            }
        }

        function renderDashboard(data) {
            const view = document.getElementById('data-view');
            view.innerHTML = `<p class="col-span-2">Hola ${data.name}, tienes ${data.projects.length} proyectos asignados.</p>`;
            // Aquí puedes añadir tu lógica de renderizado original
        }
    </script>
</body>
</html>
